version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dada_user
      POSTGRES_PASSWORD: dada_password_secure_2026
      POSTGRES_DB: dada_advisory
    ports:
      - "${DADA_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dada_user -d dada_advisory"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dada-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dada-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: staging
      PORT: 3001
      DATABASE_URL: postgresql://dada_user:dada_password_secure_2026@postgres:5432/dada_advisory?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: vSnZDzguIDt8nUaInfdwSxBkOtVZF+iltqavg6NYFUU=
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: dada-worker
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://dada_user:dada_password_secure_2026@postgres:5432/dada_advisory?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: dada-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
